<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Trieste, 1919</title>
  <link rel="stylesheet" href="/static/css/game.css">
</head>
<body>

<div id="fogIntro"></div>

<aside class="sidebar" id="sidebarPanel">
  <button class="minimize-btn" onclick="togglePanel('sidebarPanel')">—</button>

  {% if is_master %}
    <h2>Guardião</h2>

    <div class="section">
      <h3>Investigadores</h3>
      <div id="masterPlayersGrid" class="players-grid"></div>
    </div>

    <div class="section master-music">
      <h3>Música</h3>

      <select id="musicSelect">
        <option value="https://rltosysjdtsfrvntfgvz.supabase.co/storage/v1/object/public/rpg_assets/music/ambient1.mp3">Ambiente</option>
        <option value="https://rltosysjdtsfrvntfgvz.supabase.co/storage/v1/object/public/rpg_assets/music/horror.mp3">Horror</option>
        <option value="https://rltosysjdtsfrvntfgvz.supabase.co/storage/v1/object/public/rpg_assets/music/combat.mp3">Combate</option>
      </select>

      <div class="music-row">
        <button onclick="masterPlayMusic()">▶</button>
        <button onclick="masterStopMusic()">■</button>
        <button onclick="masterMuteMusic()">🔇</button>
      </div>

      <label>Volume</label>
      <input id="musicVolume" type="range" min="0" max="1" step="0.05" value="0.5" onchange="masterChangeVolume()">

      <audio id="bgMusic" loop></audio>
    </div>

  {% else %}
    <h2 id="charName">Carregando...</h2>
    <img id="charImage" src="" alt="Personagem">

    <div class="section">
      <h3>Perícias</h3>
      <div id="skillsList"></div>
    </div>
  {% endif %}
</aside>

<main class="game-board">
  <section class="city-panel" id="cityPanel">
    <button class="minimize-btn" onclick="togglePanel('cityPanel')">—</button>
    <div class="map-stage city-stage" id="cityStage">
      <img src="https://rltosysjdtsfrvntfgvz.supabase.co/storage/v1/object/public/rpg_assets/maps/trieste.webp" class="city-map">

      <button class="hotspot" style="left:17%;top:62%;" data-map="cais">Cais Velho</button>
      <button class="hotspot" style="left:20%;top:45%;" data-map="armazem">Armazem Nº7</button>
      <button class="hotspot" style="left:48%;top:47%;" data-map="hotel">Hotel Bruma Cinza</button>
      <button class="hotspot" style="left:18%;top:35%;" data-map="cafe">Café Imperiale</button>
      <button class="hotspot" style="left:56%;top:37%;" data-map="farmacia">Farmácia Weiss</button>
      <button class="hotspot" style="left:71%;top:22%;" data-map="igreja">Igreja de San Giusto</button>
      <button class="hotspot" style="left:66%;top:12%;" data-map="mirante">Mirante Esquecido</button>
      <button class="hotspot" style="left:63%;top:28%;" data-map="vicolo">Vicolo del Muschio</button>
      <button class="hotspot" style="left:44%;top:23%;" data-map="cemiterio">Cemitério Sant'Anna</button>
      <button class="hotspot" style="left:30%;top:12%;" data-map="mansao">Mansão Valdris</button>
      <button class="hotspot" style="left:74%;top:35%;" data-map="prefeitura">Prefeitura</button>
      <button class="hotspot" style="left:86%;top:48%;" data-map="delegacia">Delegacia</button>
      <button class="hotspot" style="left:63%;top:55%;" data-map="praca">Praça Central</button>
      <button class="hotspot" style="left:72%;top:87%;" data-map="Frigorifico">Frigorifico</button>
      <button class="hotspot" style="left:75%;top:63%;" data-map="esgotos">Esgotos</button>

      <div id="cityMarkersLayer"></div>
    </div>
  </section>

<section class="local-panel">
  <div class="local-header" id="localTitle">Selecione um local</div>

  <div class="map-part-controls">
    <button onclick="changeMapPart(-1)">◀ Parte</button>
    <span id="partName">---</span>
    <button onclick="changeMapPart(1)">Parte ▶</button>
  </div>

  <div class="map-stage local-stage" id="localStage">
    <img id="localMap" src="" class="local-map hidden">
    <div id="tokensLayer"></div>
  </div>
</section>
</main>

<section class="hud" id="hudPanel">
  <button class="minimize-btn" onclick="togglePanel('hudPanel')">—</button>
  <div class="san">
    <button onclick="changeStat('sanity', -1)">◀</button>
    <span id="sanity">--</span>
    <button onclick="changeStat('sanity', 1)">▶</button>
    <small>SANIDADE</small>
  </div>
<div class="hud-stat">
  <button class="stat-btn" onclick="changeStat('hp', -1)">−</button>
  ❤️ <span id="hp">--</span>
  <button class="stat-btn" onclick="changeStat('hp', 1)">+</button>
</div>
  <div>🪙 <span id="credit">--</span></div>
<div class="hud-stat">
  <button class="stat-btn" onclick="changeStat('mp', -1)">−</button>
  📖 <span id="mp">--</span>
  <button class="stat-btn" onclick="changeStat('mp', 1)">+</button>
</div>
  <div>🦶 <span id="mov">--</span></div>
</section>

<section class="quick-actions">
  <a href="/logout" class="quick-btn">Sair</a>
  <button class="quick-btn" onclick="openModal('sheetModal')">Ficha</button>
  <button class="quick-btn" onclick="openModal('notesModal')">📖 Pistas</button>
</section>

<section class="inventory" id="inventoryPanel">
  <button class="minimize-btn" onclick="togglePanel('inventoryPanel')">—</button>
<div id="inventory"></div>
</section>

<div class="modal" id="itemModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('itemModal')">-</button>

    <h2>Adicionar Item</h2>

    <input id="itemName" placeholder="Nome do item">

    <textarea
      id="itemDescription"
      placeholder="Descrição"
    ></textarea>

    <button onclick="saveItem()">Adicionar</button>
  </div>
</div>

<section class="dice" id="dicePanel">
  <button class="minimize-btn" onclick="togglePanel('dicePanel')">—</button>
  <!-- <div id="diceAnim" class="dice-anim">🎲</div> -->
  <button onclick="rollDice('d4')">d4</button>
  <button onclick="rollDice('d6')">d6</button>
  <button onclick="rollDice('d8')">d8</button>
  <button onclick="rollDice('d10')">d10</button>
  <button onclick="rollDice('d20')">d20</button>
  <button onclick="rollDice('d100')">d100</button>
</section>

<section class="live-chat" id="chatPanel">
<button class="minimize-btn" onclick="togglePanel('chatPanel')">—</button>
  <h3>Chat</h3>
  <div id="chatMessages"></div>
  <div class="chat-input">
    <input id="chatInput" placeholder="Mensagem...">
    <button onclick="sendChat()">Enviar</button>
  </div>
</section>

<section class="token-size-control">
  <label>Tamanho</label>
  <input type="range" min="60" max="260" value="140" id="tokenSizeInput">
</section>

<section class="roll-log" id="rollPanel">
 <button class="minimize-btn" onclick="togglePanel('rollPanel')">—</button>
  <h3>Rolagens</h3>
  <div id="rollLog"></div>
</section>

{% if is_master %}
<section class="master-panel" id="masterPanel">
<button class="minimize-btn" onclick="togglePanel('masterPanel')">—</button>
  <h3>Mestre</h3>
  <input id="monsterName" placeholder="Nome do monstro">
  <button onclick="openNpcModal()">Criar NPC</button>
  <button onclick="masterEvent('fog')">Névoa</button>
  <button onclick="masterEvent('shake')">Terror</button>
  <button onclick="setVttTool('move')">Mover</button>
  <button onclick="setVttTool('ping')">Ping</button>
  <button onclick="setVttTool('danger')">Perigo</button>
  <button onclick="setVttTool('fog')">Névoa Local</button>
</section>
{% endif %}


<div id="npcModal" class="modal">
  <div class="modal-box">
    <button onclick="closeModal('npcModal')">-</button>
    <input id="npcName" placeholder="Nome do NPC">
    <input type="file" id="npcImage">
    <button onclick="createNPC()">Criar</button>
  </div>
</div>


<div class="modal" id="sheetModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('sheetModal')">-</button>
    <h2 id="modalCharName"></h2>
    <div id="modalSheet"></div>
  </div>
</div>

<div class="modal" id="notesModal">
  <div class="modal-box book">
    <button class="modal-close" onclick="closeModal('notesModal')">-</button>
    <h2>Livro de Pistas</h2>
    <textarea id="playerNotes" placeholder="Escreva suas pistas aqui..."></textarea>
  </div>
</div>

<script>
  const IS_MASTER = {{ 'true' if is_master else 'false' }};
</script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/js/game.js"></script>
</body>
</html>
